name: verify published image

on:
  workflow_call:
    inputs:
      image_digest:
        description: Exact signed Barq OS digest (sha256:...)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact signed Barq OS digest (sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-image-${{ inputs.image_digest }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify signed image and runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      IMAGE_REF: ghcr.io/barq-os/barq@${{ inputs.image_digest }}
    steps:
      - name: Check out verification policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate immutable image reference
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "image_digest must be an exact sha256 digest" >&2
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify Barq OS signature
        shell: bash
        run: cosign verify --key cosign.pub "$IMAGE_REF"

      - name: Pull exact image
        shell: bash
        run: docker pull "$IMAGE_REF"

      - name: Record image audit evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          audit_dir=build/image-audit
          mkdir -p "$audit_dir"
          docker image inspect "$IMAGE_REF" > "$audit_dir/image-inspect.json"
          docker image inspect --format '{{.Size}}' "$IMAGE_REF" > "$audit_dir/image-size-bytes.txt"
          printf '%s\n' "$IMAGE_REF" > "$audit_dir/image-reference.txt"
          docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -lc \
            'rpm -qa --qf "%{NAME}\t%{VERSION}-%{RELEASE}\t%{ARCH}\n" | LC_ALL=C sort' \
            > "$audit_dir/rpm-packages.tsv"
          docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -lc \
            'cat /etc/os-release' > "$audit_dir/os-release.txt"

      - name: Upload image audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: barq-image-audit-${{ github.run_id }}
          path: build/image-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Execute image checks
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --privileged --entrypoint /bin/bash "$IMAGE_REF" -lc '/usr/libexec/barq-os/image-smoke-test --image && bootc container lint'
