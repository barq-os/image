name: Bug report
description: Report a reproducible Barq OS image, installation, hardware, or gaming problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Barq OS. Remove private data, tokens and account names before posting logs.
  - type: input
    id: image
    attributes:
      label: Image reference
      description: Paste the exact tag or digest shown by rpm-ostree status.
      placeholder: ghcr.io/barq-os/barq@sha256:...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: CPU, GPU, driver, firmware, display, controller and connection type when relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Include relevant rpm-ostree status, journal output and application logs after removing private data.
      render: shell
