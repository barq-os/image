---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: barq

description: Barq OS — a modern Linux operating system designed for gaming, performance, simplicity, and control.

base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 44

modules:
  - from-file: common/gaming.yml
  - from-file: common/fonts.yml
  - from-file: common/applications.yml
  - from-file: common/desktop-packages.yml

  # Install distro branding after packages so package-owned defaults cannot
  # overwrite Barq's PLM, Plasma and Plymouth configuration.
  - from-file: common/system-files.yml
  - from-file: common/desktop-services.yml
  - from-file: common/identity-setup.yml

  # Plymouth is embedded in the system initramfs, so regenerate it once after
  # all boot-theme files and configuration are in place.
  - type: initramfs

  # Set Barq OS identity after all Fedora-aware build steps have completed.
  - from-file: common/identity.yml
  - from-file: common/identity-validation.yml

  # Keep signing last so the completed image carries Barq's verification policy.
  - type: signing
