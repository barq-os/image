---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

version: 1

name: barq

description: Barq OS — a modern Linux operating system designed for gaming, performance, simplicity, and control.

base-image: ghcr.io/blue-build/base-images/fedora-kinoite
image-version: 44

modules:
  - from-file: common/system-files.yml
  - from-file: common/gaming.yml
  - from-file: common/fonts.yml
  - from-file: common/applications.yml

  # Set Barq OS identity after all Fedora-aware build steps have completed.
  - from-file: common/identity.yml

  # Fail the build if the assembled image no longer satisfies Barq's baseline.
  - from-file: common/validation.yml

  # Keep signing last so the completed image carries Barq's verification policy.
  - type: signing
